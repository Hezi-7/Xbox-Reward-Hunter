
name: Xbox Reward Hunter Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: xbox-reward-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover Xbox rewards
        run: python hunter.py

      - name: Check reward data
        run: |
          python -m json.tool docs/offers.json > /dev/null

      - name: Publish updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Xbox reward discoveries"
            git push
          fi
